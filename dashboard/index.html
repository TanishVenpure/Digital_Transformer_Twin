<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transformer Twin Dashboard</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171d24;
    --panel-2: #1e252e;
    --border: #2a333e;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #3fa7ff;
    --track: #262f3a;
    --placeholder: #3a4552;
    --normal: #3fb950;
    --warning: #d29922;
    --predicted: #a371f7;
    --maintenance: #f0883e;
    --critical: #f85149;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .status { color: var(--muted); font-size: 12px; }

  .layout {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: 1fr auto;
    gap: 12px;
    padding: 12px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-title {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .panel-title a { color: var(--accent); text-decoration: none; text-transform: none; letter-spacing: 0; }

  /* ---------- Left column: health bars + 3D model ---------- */
  .left { display: flex; flex-direction: column; gap: 12px; min-height: 0; }

  .health-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    padding: 12px 14px;
  }
  .health {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    min-width: 0;
  }
  .health .row { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
  .health .name { font-weight: 600; font-size: 13px; }
  .health .value { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .health .sub { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0 6px; }
  .health .state { font-size: 11px; font-weight: 600; margin-top: 6px; color: var(--muted); }
  .bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--placeholder); transition: width .15s, background-color .15s; }

  .model { flex: 1; }
  .model-body {
    flex: 1;
    position: relative;
    margin: 10px;
    min-height: 240px;
    border: 2px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    transition: border-color .2s;
  }
  .model-body canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .model-info {
    position: absolute; left: 10px; top: 10px; z-index: 2;
    background: rgba(15, 20, 25, .82); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; max-width: calc(100% - 20px); pointer-events: none;
  }
  .model-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .model-signal { font-size: 12px; font-weight: 600; }
  .model-call { font: 11px/1.4 ui-monospace, Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
  .model-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; pointer-events: none; }
  .model-loading:empty { display: none; }
  .panel-title .tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .panel-title { flex-wrap: wrap; align-items: center; }
  .panel-title .tools button { padding: 2px 8px; font-size: 11px; text-transform: none; letter-spacing: 0; }
  .chips { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .chip {
    position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px;
    padding: 1px 6px 1px 4px; border-radius: 3px; white-space: nowrap; pointer-events: auto; cursor: pointer;
    font: 500 10px/1.5 ui-monospace, Consolas, monospace; color: var(--text);
    background: rgba(10, 13, 16, .8); border: 1px solid color-mix(in srgb, var(--c, #5c6773) 60%, transparent);
    transition: opacity .2s;
  }
  .seg { display: flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #06121f; }
  .model-bar {
    position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 2;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
    background: rgba(15, 20, 25, .82); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
    font-size: 11px; color: var(--muted);
  }
  .model-bar button { padding: 3px 10px; font-size: 11px; }
  .model-bar .explode { display: flex; align-items: center; gap: 8px; flex: 1 1 180px; min-width: 0; }
  .model-bar input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .model-bar output { color: var(--text); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
  .model-bar label.check { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .model-bar input[type=checkbox] { accent-color: var(--accent); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #5c6773); }
  .chip.dim { opacity: .25; }

  /* ---------- Right column: LLM + maintenance ---------- */
  .right { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .chat { flex: 1 1 50%; }
  .chat-body {
    flex: 1;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: auto;
  }
  .msg {
    max-width: 85%;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .msg.user { align-self: flex-end; }
  .chat-input {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
  }
  .chat-input input {
    flex: 1;
    min-width: 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    color: var(--text);
  }
  button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    color: var(--text);
    cursor: pointer;
    font: inherit;
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { color: var(--muted); cursor: not-allowed; }

  .maint { flex: 1 1 50%; }
  .maint-list { flex: 1; overflow: auto; padding: 6px 0; min-height: 120px; }
  .check {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .check .no { color: var(--muted); font-variant-numeric: tabular-nums; }
  .check .what { font-weight: 600; }
  .check .action { grid-column: 2; color: var(--muted); }
  .check .when { grid-column: 2; color: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); padding: 14px; font-size: 12px; }

  /* ---------- Bottom: data drop + timeline ---------- */
  .bottom {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 12px;
  }
  .drop {
    margin: 14px;
    flex: 1;
    border: 2px dashed var(--border);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 16px;
    color: var(--muted);
    text-align: center;
    cursor: pointer;
  }
  .drop.over { border-color: var(--accent); color: var(--text); }
  .drop small { font-size: 11px; }
  .drop .result { font-size: 11px; color: var(--text); }

  .timeline-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .controls .time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .issues { color: var(--muted); font-size: 12px; min-height: 18px; }
  .issues b { color: var(--warning); font-weight: 600; }
  .track {
    position: relative;
    height: 10px;
    background: var(--track);
    border-radius: 5px;
    cursor: pointer;
    touch-action: none;
  }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); opacity: .35; border-radius: 5px; }
  .track .knob {
    position: absolute;
    left: 0;
    top: 50%;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%);
  }
  .ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }

  .s-NORMAL { --c: var(--normal); }
  .s-WARNING { --c: var(--warning); }
  .s-PREDICTED_MAINTENANCE { --c: var(--predicted); }
  .s-MAINTENANCE_REQUIRED { --c: var(--maintenance); }
  .s-CRITICAL { --c: var(--critical); }
  .health[class*="s-"] .bar > span { background: var(--c); }
  .health[class*="s-"] .state, .check[class*="s-"] .what, .model-signal { color: var(--c, var(--muted)); }
  .model-body[class*="s-"] { border-color: var(--c); }

  @media (max-width: 1100px) {
    .health-grid { grid-template-columns: repeat(4, 1fr); }
  }
  .layout > *, .bottom > * { min-width: 0; }
  @media (max-width: 900px) {
    html, body { height: auto; }
    header { flex-wrap: wrap; padding: 12px 16px; }
    .layout { display: flex; flex-direction: column; padding: 12px 16px; }
    .left, .right { min-height: auto; }
    .model { flex: none; }
    .health-grid { grid-template-columns: repeat(2, 1fr); }
    .bottom { display: flex; flex-direction: column; }
    .maint-list { max-height: 360px; }
    .model-body { min-height: 340px; flex: none; }
    .chat { min-height: 300px; }
    .maint { min-height: 320px; }
  }
</style>
</head>
<body>

<header>
  <h1>Digital Transformer Twin</h1>
  <span class="status" id="status">Connecting…</span>
</header>

<main class="layout">

  <!-- Left: health bars on top, 3D model below -->
  <section class="left">
    <div class="panel">
      <div class="panel-title"><span>Sensor health</span><span id="transformer"></span></div>
      <div class="health-grid" id="health-grid"></div>
    </div>

    <div class="panel model">
      <div class="panel-title">
        <span>3D model</span>
        <span class="tools">
          <span class="seg" role="group" aria-label="Tank view">
            <button data-mode="solid" aria-pressed="false">Solid</button><button data-mode="cut" aria-pressed="false">Cutaway</button><button data-mode="xray" aria-pressed="true">X-ray</button>
          </span>
          <button id="view-spin">Spin</button><button id="view-reset" title="Back to the signalled view">Reset view</button>
        </span>
      </div>
      <div class="model-body" id="model-viewport">
        <div class="model-info">
          <div class="model-name" id="model-name">Base transformer</div>
          <div class="model-signal" id="model-signal">All IoTs normal</div>
          <div class="model-call" id="model-call"></div>
        </div>
        <div class="model-loading" id="model-loading"></div>
        <div class="model-bar">
          <button id="explode-btn">Explode</button>
          <label class="explode" for="explode">Exploded
            <input type="range" id="explode" min="0" max="100" value="0">
            <output id="explode-v" for="explode">0%</output>
          </label>
          <label class="check"><input type="checkbox" id="oil-toggle" checked> Oil</label>
          <label class="check"><input type="checkbox" id="labels-toggle" checked> Labels</label>
        </div>
      </div>
    </div>
  </section>

  <!-- Right: LLM assistant + maintenance sheet -->
  <aside class="right">
    <div class="panel chat">
      <div class="panel-title">Assistant</div>
      <div class="chat-body">
        <div class="msg">Assistant responses will appear here.</div>
        <div class="msg user">User question placeholder</div>
      </div>
      <div class="chat-input">
        <input type="text" placeholder="Ask about the transformer…" disabled>
        <button disabled>Send</button>
      </div>
    </div>

    <div class="panel maint">
      <div class="panel-title">
        <span>Maintenance sheet <span id="maint-count"></span></span>
        <a id="maint-download" href="#" download>CSV</a>
      </div>
      <div class="maint-list" id="maint-list"><div class="empty">No checks yet.</div></div>
    </div>
  </aside>

  <!-- Bottom: data drop + time-series timeline -->
  <section class="bottom">
    <div class="panel">
      <div class="panel-title">Data</div>
      <label class="drop" id="drop">
        <span>Drop data file here</span>
        <small>CSV · hourly readings · validated on upload</small>
        <span class="result" id="drop-result"></span>
        <input type="file" id="file" accept=".csv" hidden>
      </label>
    </div>

    <div class="panel">
      <div class="panel-title"><span>Timeline</span><span>1 day / second at 1×</span></div>
      <div class="timeline-body">
        <div class="controls">
          <button id="back" title="Back one day" disabled>&#9198;</button>
          <button id="play" title="Play / pause" disabled>&#9654;</button>
          <button id="fwd" title="Forward one day" disabled>&#9197;</button>
          <button id="speed" title="Playback speed" disabled>1×</button>
          <span class="time" id="time">--:-- / --:--</span>
        </div>
        <div class="track" id="track"><span class="fill" id="fill"></span><span class="knob" id="knob"></span></div>
        <div class="ticks" id="ticks"><span>start</span><span></span><span></span><span></span><span>end</span></div>
        <div class="issues" id="issues"></div>
      </div>
    </div>
  </section>

</main>

<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/GLTFLoader.js"></script>
<script src="vendor/three/OrbitControls.js"></script>
<script src="vendor/three/RoomEnvironment.js"></script>
<script src="twin3d.js"></script>
<script>
(() => {
  const API = "/api";
  // Write calls need X-Twin-API-Key. The operator types it in; it is kept only for this
  // tab (sessionStorage) and never embedded in the page.
  const KEY_STORE = "twinApiKey";
  function writeHeaders(extra = {}) {
    let key = null;
    try { key = sessionStorage.getItem(KEY_STORE); } catch (_) { /* storage unavailable */ }
    return key ? { ...extra, "X-Twin-API-Key": key } : extra;
  }
  function askForKey() {
    const key = window.prompt("API key for uploads and model signalling (kept for this tab only):");
    try { key ? sessionStorage.setItem(KEY_STORE, key) : sessionStorage.removeItem(KEY_STORE); } catch (_) { /* ignore */ }
    return Boolean(key);
  }
  const SPEEDS = [1, 2, 4, 0.5];
  // Provisional bar fill per status until the Health Engine provides a score.
  const FILL = { NORMAL: 100, WARNING: 65, PREDICTED_MAINTENANCE: 50, MAINTENANCE_REQUIRED: 30, CRITICAL: 12 };
  const LABEL = { NORMAL: "Normal", WARNING: "Warning", PREDICTED_MAINTENANCE: "Predicted", MAINTENANCE_REQUIRED: "Maintenance", CRITICAL: "Critical" };
  const SHORT_NAME = ["Current sensor", "Voltage sensor", "Current", "Voltage", "Oil level", "Top-oil temp", "Winding temp"];
  const UNIT = { percent: "%", percent_of_rated: "%", percent_deviation: "%", percent_of_gauge: "%", degC: "°C", K_rise_over_ambient: "K" };

  const $ = (id) => document.getElementById(id);
  const twin = window.Twin3D
    ? Twin3D.create(document.getElementById("model-viewport"), {
        onStatus: (t) => (document.getElementById("model-loading").textContent = t),
        // link options: ?view=solid|cut|xray  ?explode=0..100 (skips the intro)  ?intro=0
        mode: new URLSearchParams(location.search).get("view") || undefined,
        noIntro: /(^|[?&])(intro=0|explode=)/.test(location.search),
        t: (Number(new URLSearchParams(location.search).get("explode")) || 0) / 100,
        onExplode: (t) => {
          const pct = Math.round(t * 100);
          document.getElementById("explode").value = pct;
          document.getElementById("explode-v").textContent = pct + "%";
          document.getElementById("explode-btn").textContent = t > 0.5 ? "Assemble" : "Explode";
        },
      })
    : { setStatuses() {}, focus() {}, resetView() {}, toggleSpin() { return false; }, setMode() {}, setOil() {}, setLabels() {}, explode() {}, t: 0 };
  const state = { data: null, sheet: [], pos: 0, playing: false, speed: 0, frame: -1, last: 0, model: null, signalBusy: false, signalPending: null };

  const fmtTime = (iso) => { const d = new Date(iso); return d.toISOString().slice(0, 16).replace("T", " "); };
  const fmtDay = (iso) => new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" });
  const setStatusClass = (el, status) => { el.className = el.className.replace(/\bs-\S+/g, "").trim(); if (status) el.classList.add("s-" + status); };

  function buildBars(iots) {
    $("health-grid").innerHTML = iots.map((iot, i) => `
      <div class="health" id="iot-${iot.slot}" title="${iot.display_name}">
        <div class="row"><span class="name">IOT${iot.slot}</span><span class="value">—</span></div>
        <div class="sub">${SHORT_NAME[i] || iot.display_name}</div>
        <div class="bar"><span></span></div>
        <div class="state">No data</div>
      </div>`).join("");
  }

  async function load(transformerId) {
    const [timeline, sheet] = await Promise.all([
      fetch(`${API}/timeline/${encodeURIComponent(transformerId)}`).then((r) => r.json()),
      fetch(`${API}/maintenance/${encodeURIComponent(transformerId)}`).then((r) => r.json()),
    ]);
    state.data = timeline;
    state.sheet = sheet.rows;
    state.pos = 0; state.frame = -1; state.model = null;
    buildBars(timeline.iots);
    $("transformer").textContent = `Transformer ${timeline.transformer_id}`;
    $("maint-download").href = `${API}/maintenance/${encodeURIComponent(transformerId)}?format=csv`;
    const n = timeline.frames.length;
    $("status").textContent = `${n} hourly readings · ${fmtDay(timeline.start)} – ${fmtDay(timeline.end)} · ${sheet.checks} maintenance checks`;
    const ticks = [0, .25, .5, .75, 1].map((f) => fmtDay(timeline.frames[Math.round(f * (n - 1))].t));
    $("ticks").innerHTML = ticks.map((t) => `<span>${t}</span>`).join("");
    ["back", "play", "fwd", "speed"].forEach((id) => ($(id).disabled = false));
    const start = /t=(\d+)/.exec(location.hash);  // e.g. #t=960 opens at hour 960
    state.pos = start ? Math.min(n - 1, Number(start[1])) : 0;
    render(true);
  }

  function render(force) {
    const frames = state.data.frames;
    const index = Math.min(frames.length - 1, Math.floor(state.pos));
    const ratio = frames.length > 1 ? state.pos / (frames.length - 1) : 0;
    $("knob").style.left = `${ratio * 100}%`;
    $("fill").style.width = `${ratio * 100}%`;
    if (index === state.frame && !force) return;
    state.frame = index;
    const frame = frames[index];
    if (!frame) return;
    $("time").textContent = `${fmtTime(frame.t)} UTC · day ${Math.floor(index / 24) + 1} of ${Math.ceil(frames.length / 24)}`;

    state.data.iots.forEach((iot, i) => {
      const el = $(`iot-${iot.slot}`), status = frame.s[i], value = frame.v[i];
      setStatusClass(el, status);
      el.querySelector(".bar > span").style.width = status ? `${FILL[status]}%` : "0";
      el.querySelector(".state").textContent = status ? LABEL[status] : "No data";
      el.querySelector(".value").textContent = value == null ? "—" : `${value.toFixed(1)}${UNIT[iot.unit] ?? ""}`;
    });

    const bad = frame.q.filter(([, code]) => code !== "MISSING");
    const missing = frame.q.length - bad.length;
    $("issues").innerHTML = frame.q.length
      ? `<b>Validation:</b> ${bad.map(([f, c]) => `${f} ${c.toLowerCase().replaceAll("_", " ")}`).join(", ")}${bad.length && missing ? ", " : ""}${missing ? `${missing} missing` : ""}`
      : "All inputs valid";

    twin.setStatuses(frame.s);
    renderModel(frame);
    renderSheet(frame.t);
  }

  function renderModel(frame) {
    if (frame.m === state.model) return;
    state.model = frame.m;
    const slot = frame.m === "base" ? null : Number(frame.m.replace("iot", ""));
    const status = slot ? frame.s[slot - 1] : null;
    $("model-name").textContent = slot ? `IOT${slot} · ${state.data.models[frame.m]}` : state.data.models.base;
    $("model-signal").textContent = slot ? `Signalled: ${LABEL[status]}` : "All IoTs normal";
    setStatusClass($("model-viewport"), status);
    twin.focus(slot);
    signal(frame.id);
  }

  // Tell FastAPI the shown model changed; it calls the Blender bridge. One request in flight.
  async function signal(readingId) {
    if (state.signalBusy) { state.signalPending = readingId; return; }
    state.signalBusy = true;
    try {
      const response = await fetch(`${API}/twin3d/signal`, {
        method: "POST", headers: writeHeaders({ "Content-Type": "application/json" }),
        body: JSON.stringify({ reading_id: readingId, source: "timeline" }),
      });
      if (response.status === 401 || response.status === 503) {
        $("model-call").textContent = "Model signalling needs an API key (enter it when uploading a CSV).";
        return;
      }
      const res = await response.json();
      if (res.model_call) {
        const c = res.model_call;
        $("model-call").textContent = `${c.action}(${c.model_id}) ← ${c.previous_model ?? "none"} · ${c.model.blend_file} · ${c.status}`;
      }
    } catch (e) {
      $("model-call").textContent = "Signal failed: " + e.message;
    } finally {
      state.signalBusy = false;
      if (state.signalPending != null) { const next = state.signalPending; state.signalPending = null; signal(next); }
    }
  }

  function renderSheet(iso) {
    const until = new Date(iso).getTime();
    // Sheet is sorted by check_no (= date order); find how many checks are opened by now.
    let lo = 0, hi = state.sheet.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (new Date(state.sheet[mid].opened_at).getTime() <= until) lo = mid + 1; else hi = mid; }
    $("maint-count").textContent = `· ${lo} of ${state.sheet.length}`;
    const recent = state.sheet.slice(Math.max(0, lo - 40), lo).reverse();
    $("maint-list").innerHTML = recent.length ? recent.map((c) => {
      const resolved = c.resolved_at && new Date(c.resolved_at).getTime() <= until;
      return `<div class="check s-${c.signal}">
        <span class="no">#${c.check_no}</span><span class="what">IOT${c.iot} · ${LABEL[c.signal]}</span>
        <span class="action">${c.recommended_action}</span>
        <span class="when">${c.date} ${c.time_utc} UTC · ${resolved ? `resolved after ${c.duration_hours} h` : "open"}</span>
      </div>`;
    }).join("") : `<div class="empty">No checks yet.</div>`;
  }

  // ---------- playback: 1 day (24 hourly frames) per second at 1x ----------
  // Wall-clock based, so speed stays exact even if the browser throttles the timer.
  function tick() {
    if (!state.data || !Number.isFinite(state.pos)) return setPlaying(false);
    const now = performance.now();
    const dt = (now - state.last) / 1000;
    state.last = now;
    const max = state.data.frames.length - 1;
    state.pos = Math.min(max, state.pos + dt * state.data.hours_per_second * SPEEDS[state.speed]);
    render();
    if (state.pos >= max) setPlaying(false);
  }
  function setPlaying(on) {
    if (on && state.pos >= state.data.frames.length - 1) state.pos = 0;
    state.playing = on;
    $("play").innerHTML = on ? "&#10074;&#10074;" : "&#9654;";
    clearInterval(state.timer);
    if (on) { state.last = performance.now(); state.timer = setInterval(tick, 1000 / 30); }
  }
  const seek = (pos) => { state.pos = Math.max(0, Math.min(state.data.frames.length - 1, pos)); render(); };

  $("view-reset").onclick = () => twin.focus(state.model && state.model !== "base" ? Number(state.model.replace("iot", "")) : null);
  const linkView = new URLSearchParams(location.search).get("view");
  if (linkView) document.querySelectorAll(".seg [data-mode]").forEach((x) => x.setAttribute("aria-pressed", x.dataset.mode === linkView));
  document.querySelectorAll(".seg [data-mode]").forEach((b) => (b.onclick = () => {
    document.querySelectorAll(".seg [data-mode]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    twin.setMode(b.dataset.mode);
  }));
  $("explode-btn").onclick = () => twin.explode(twin.t > 0.5 ? 0 : 1, true);
  $("explode").addEventListener("input", (e) => twin.explode(e.target.value / 100, false));
  $("oil-toggle").onchange = (e) => twin.setOil(e.target.checked);
  $("labels-toggle").onchange = (e) => twin.setLabels(e.target.checked);
  $("view-spin").onclick = () => { $("view-spin").textContent = twin.toggleSpin() ? "Stop" : "Spin"; };
  $("play").onclick = () => setPlaying(!state.playing);
  $("back").onclick = () => seek(Math.floor(state.pos) - 24);
  $("fwd").onclick = () => seek(Math.floor(state.pos) + 24);
  $("speed").onclick = () => { state.speed = (state.speed + 1) % SPEEDS.length; $("speed").textContent = `${SPEEDS[state.speed]}×`; };

  const track = $("track");
  const scrub = (e) => { const r = track.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * (state.data.frames.length - 1)); };
  track.addEventListener("pointerdown", (e) => { if (!state.data) return; track.setPointerCapture(e.pointerId); scrub(e); });
  track.addEventListener("pointermove", (e) => { if (track.hasPointerCapture(e.pointerId)) scrub(e); });

  // ---------- data drop: upload CSV, validated server-side ----------
  const drop = $("drop");
  async function upload(file) {
    if (!file) return;
    $("drop-result").textContent = `Uploading ${file.name}…`;
    const form = new FormData();
    form.append("file", file);
    form.append("transformer_id", state.data?.transformer_id || "T1");
    try {
      const send = () => fetch(`${API}/upload`, { method: "POST", body: form, headers: writeHeaders() });
      let res = await send();
      if (res.status === 401 && askForKey()) res = await send();
      const body = await res.json();
      if (!res.ok) throw new Error(body.detail || res.statusText);
      const issues = Object.entries(body.issues).map(([k, v]) => `${v} ${k.toLowerCase().replaceAll("_", " ")}`).join(", ");
      $("drop-result").textContent = `${body.stored} stored, ${body.rejected} rejected${issues ? ` · ${issues}` : ""}`;
      setPlaying(false);
      await load(body.transformers[0]);
    } catch (e) {
      $("drop-result").textContent = "Upload failed: " + e.message;
    }
  }
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files[0]); });
  $("file").addEventListener("change", (e) => upload(e.target.files[0]));

  fetch(`${API}/transformers`).then((r) => {
    if (!r.ok) throw new Error(`HTTP ${r.status} from ${API}/transformers (is the twin_iot API running?)`);
    return r.json();
  }).then((list) => {
    if (!list.length) { $("status").textContent = "No data: run scripts/simulate.py or drop a CSV"; return; }
    return load(list[0].transformer_id);
  }).catch((e) => { $("status").textContent = "API unavailable: " + e.message; });
})();
</script>
</body>
</html>
