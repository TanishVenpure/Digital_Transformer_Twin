# One rule per IoT, in dashboard order (iot_slot 1..7 = IOT1..IOT7).
# operator: ">"/">=" means higher is worse, "<"/"<=" means lower is worse.
# warning/critical use the same operator. A null limit disables that check.
# lead_time_hours: raise PREDICTED_MAINTENANCE when the trend reaches the
# critical limit within this many hours. Null disables prediction.
#
# Values marked EXAMPLE are prototype placeholders. Replace them with the
# actual transformer nameplate / manufacturer specification.
formulas:
  current_measurement_health:
    iot_slot: 1
    operator: ">"
    unit: percent
    critical: 1.0              # max permitted instrument error (agreed acceptance Test 1)
    breach_signal: MAINTENANCE_REQUIRED
    maintenance_type: SYSTEM_MAINTENANCE
    critical_message: "Current sensor error exceeds the permitted accuracy; current sensor maintenance required."

  voltage_measurement_health:
    iot_slot: 2
    operator: ">"
    unit: percent
    critical: 1.0              # max permitted instrument error (agreed acceptance Test 1)
    breach_signal: MAINTENANCE_REQUIRED
    maintenance_type: SYSTEM_MAINTENANCE
    critical_message: "Voltage sensor error exceeds the permitted accuracy; voltage sensor maintenance required."

  current_loading:
    iot_slot: 3
    operator: ">="
    unit: percent_of_rated
    warning: 110.0             # supplied overload warning setting, inclusive
    critical: 120.0            # supplied trip-alert setting, inclusive
    lead_time_hours: null      # instantaneous thresholds; no prediction alert
    maintenance_type: TRANSFORMER_MAINTENANCE
    warning_when_critical: false
    suppress_repeated_alerts: true
    warning_trigger_condition: OVERLOAD_WARNING
    critical_trigger_condition: TRIP_ALERT
    condition_detail: overload_condition
    warning_message: "LV current loading reached or exceeded the 110% overload warning setting."
    critical_message: "LV current loading reached or exceeded the 120% permitted limit; trip alert only."
    parameters:
      rated_kva: 633.0         # supplied transformer nameplate capacity
      rated_voltage_ll: 433.0  # V, supplied LV rated line-to-line voltage

  voltage_deviation:
    iot_slot: 4
    operator: ">="
    unit: percent_deviation
    warning: null
    critical: null
    lead_time_hours: null
    maintenance_type: TRANSFORMER_MAINTENANCE
    suppress_repeated_alerts: true
    critical_message: "LV RMS voltage reached a trip setting; alert only."
    parameters:
      rated_voltage_ll: 433
      measurement_type: null  # must confirm LINE_TO_LINE or PHASE_TO_NEUTRAL
    extra_checks:
      - detail: overvoltage_percent
        operator: ">="
        threshold: 3.0
        unit: percent_deviation
        signal: WARNING
        suppress_when_critical: true
        trigger_condition: OVERVOLTAGE_WARNING
        message: "LV overvoltage reached the 3% warning setting."
      - detail: overvoltage_percent
        operator: ">="
        threshold: 6.0
        unit: percent_deviation
        signal: CRITICAL
        suppress_when_critical: true
        trigger_condition: OVERVOLTAGE_TRIP_ALERT
        message: "LV overvoltage reached the 6% trip alert setting."
      - detail: undervoltage_percent
        operator: ">="
        threshold: 3.0
        unit: percent_deviation
        signal: WARNING
        suppress_when_critical: true
        trigger_condition: UNDERVOLTAGE_WARNING
        message: "LV undervoltage reached the 3% warning setting."
      - detail: undervoltage_percent
        operator: ">="
        threshold: 6.0
        unit: percent_deviation
        signal: CRITICAL
        suppress_when_critical: true
        trigger_condition: UNDERVOLTAGE_TRIP_ALERT
        message: "LV undervoltage reached the 6% trip alert setting."

  oil_level:
    iot_slot: 5
    operator: "<="
    unit: percent_of_gauge
    warning: 40.0              # EXAMPLE warning oil level
    critical: 20.0             # EXAMPLE minimum permissible oil level
    lead_time_hours: 72.0      # EXAMPLE maintenance lead time
    maintenance_type: TRANSFORMER_MAINTENANCE
    warning_message: "Oil level crossed the warning level."
    critical_message: "Oil level reached the minimum permissible level."
    predicted_message: "Oil level is predicted to reach the minimum level within the maintenance lead time."

  top_oil_temperature:
    iot_slot: 6
    operator: ">="
    unit: degC
    warning: 95.0              # example alarm (CPRI reference)
    critical: 105.0            # example trip (CPRI reference)
    lead_time_hours: 6.0       # EXAMPLE
    maintenance_type: TRANSFORMER_MAINTENANCE
    warning_message: "Top-oil temperature reached the alarm setting."
    critical_message: "Top-oil temperature reached the trip setting."
    predicted_message: "Top-oil temperature is predicted to reach the trip setting within the lead time."
    extra_checks:
      - detail: top_oil_rise
        operator: ">"
        threshold: 40.0        # top-oil rise limit over ambient (CPRI reference)
        unit: K
        signal: WARNING
        message: "Top-oil temperature rise over ambient exceeds the permitted rise."

  winding_temperature:
    iot_slot: 7
    operator: ">"
    unit: K_rise_over_ambient
    warning: 40.0              # EXAMPLE warning rise
    critical: 45.0             # max winding rise (CPRI reference)
    lead_time_hours: 6.0       # EXAMPLE
    maintenance_type: TRANSFORMER_MAINTENANCE
    warning_message: "Winding temperature rise is approaching the permitted rise."
    critical_message: "Winding temperature rise exceeds the permitted rise."
    predicted_message: "Winding temperature rise is predicted to exceed the permitted rise within the lead time."

  transformer_pressure_monitoring:
    iot_slot: 8
    operator: ">="
    unit: null                 # physical pressure unit must be supplied before comparisons
    warning: null              # pressure_warning: not supplied
    critical: null             # pressure_critical: not supplied
    lead_time_hours: null       # no pressure forecasting or scheduling
    maintenance_type: TRANSFORMER_MAINTENANCE
    maintenance_sheet: true
    breach_signal: CRITICAL
    warning_when_critical: false
    warning_trigger_condition: HIGH_PRESSURE_WARNING
    critical_trigger_condition: PRESSURE_CRITICAL
    condition_detail: absolute_pressure_condition
    warning_detail: pressure_warning
    critical_detail: pressure_critical
    warning_message: "Transformer pressure reached or exceeded the configured warning threshold."
    critical_message: "Transformer pressure reached or exceeded the configured critical threshold."
    extra_checks:
      - detail: pressure_rate
        operator: ">="
        threshold: null        # pressure_rise_rate_critical: not supplied
        unit: null             # must equal configured pressure unit/hour; no implicit conversion
        unit_detail: pressure_rate_unit
        signal: CRITICAL
        trigger_condition: RAPID_PRESSURE_RISE
        condition_detail: rapid_pressure_condition
        threshold_detail: pressure_rise_rate_critical
        message: "Transformer pressure rise rate reached or exceeded the configured critical rate."

  hv_voltage_deviation:
    iot_slot: 9
    operator: ">="
    unit: percent_deviation
    warning: null
    critical: null
    lead_time_hours: null
    maintenance_type: TRANSFORMER_MAINTENANCE
    suppress_repeated_alerts: true
    critical_message: "HV RMS voltage reached a trip setting; alert only."
    parameters:
      rated_voltage_ll: 11000
      measurement_type: null  # must confirm LINE_TO_LINE or PHASE_TO_NEUTRAL
    extra_checks:
      - detail: overvoltage_percent
        operator: ">="
        threshold: 3.0
        unit: percent_deviation
        signal: WARNING
        suppress_when_critical: true
        trigger_condition: OVERVOLTAGE_WARNING
        message: "HV overvoltage reached the 3% warning setting."
      - detail: overvoltage_percent
        operator: ">="
        threshold: 6.0
        unit: percent_deviation
        signal: CRITICAL
        suppress_when_critical: true
        trigger_condition: OVERVOLTAGE_TRIP_ALERT
        message: "HV overvoltage reached the 6% trip alert setting."
      - detail: undervoltage_percent
        operator: ">="
        threshold: 5.0
        unit: percent_deviation
        signal: WARNING
        suppress_when_critical: true
        trigger_condition: UNDERVOLTAGE_WARNING
        message: "HV undervoltage reached the 5% warning setting."
      - detail: undervoltage_percent
        operator: ">="
        threshold: 9.0
        unit: percent_deviation
        signal: CRITICAL
        suppress_when_critical: true
        trigger_condition: UNDERVOLTAGE_TRIP_ALERT
        message: "HV undervoltage reached the 9% trip alert setting."
