# One command: API + dashboard (no database needed).
#   docker compose up -d --build        -> http://localhost:8020/dashboard/
# Port can be changed: TWIN_API_PORT=8080 docker compose up -d
services:
  api:
    build:
      context: ..
      dockerfile: twin_iot/Dockerfile
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${TWIN_API_PORT:-8020}:8020"
